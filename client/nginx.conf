server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;

  # Compression: gzip only (the stock nginx image has no brotli module). Covers the ~860KB animated SVGs,
  # JSON API responses and /uploads SVGs proxied from the API.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript text/javascript application/json application/xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build output never changes for a given filename.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-supplied animated SVGs (client/public/animations): not content-hashed, so cache for a month.
  location /animations/ {
    add_header Cache-Control "public, max-age=2592000";
    add_header Vary "Accept-Encoding";
    try_files $uri =404;
  }

  # Self-hosted fonts (client/public/fonts): file names are versioned by the font package.
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Never cache the app shell so new deploys are picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # React Router: serve index.html for any unknown path.
  location / {
    try_files $uri /index.html;
  }
}
