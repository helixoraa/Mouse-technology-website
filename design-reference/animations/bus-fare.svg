<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 340" width="600" height="340" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif">
  <!-- Cashless bus fare animation · 8s loop · base attributes = final "fare paid" state (what Figma shows on import) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1C66"/>
      <stop offset="0.55" stop-color="#1A45D6"/>
      <stop offset="1" stop-color="#3A7BFF"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FC1FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8FC1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B3BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5B3BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16307F" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A1650" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9DCFF"/>
    </linearGradient>
    <linearGradient id="routeDone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#050C33" flood-opacity="0.45"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="frame"><rect width="600" height="340" rx="28"/></clipPath>
    <g id="nfc" fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M-5,-7 a10,10 0 0 1 0,14"/>
      <path d="M0,-11 a15,15 0 0 1 0,22"/>
      <path d="M5,-15 a21,21 0 0 1 0,30"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="600" height="340" fill="url(#bg)"/>
    <rect width="600" height="340" fill="url(#dots)"/>
    <circle cx="500" cy="40" r="170" fill="url(#blobA)">
      <animate attributeName="cx" values="500;440;500" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="330" r="180" fill="url(#blobB)">
      <animate attributeName="cx" values="60;120;60" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- Live route line -->
    <text x="40" y="30" font-size="11" font-weight="700" fill="#FFFFFF">Route 12</text>
    <text x="94" y="30" font-size="11" fill="#FFFFFF" fill-opacity="0.6">· Live</text>
    <circle cx="136" cy="26.5" r="3" fill="#6EE7B7">
      <animate attributeName="fill-opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <line x1="40" y1="46" x2="560" y2="46" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round"/>
    <rect x="40" y="45" width="300" height="2" rx="1" fill="url(#routeDone)">
      <animate attributeName="width" values="0;520" dur="16s" repeatCount="indefinite"/>
    </rect>
    <g fill="#0F2A8F" stroke="#FFFFFF" stroke-width="2">
      <circle cx="40" cy="46" r="4"/>
      <circle cx="170" cy="46" r="4"/>
      <circle cx="300" cy="46" r="4"/>
      <circle cx="430" cy="46" r="4"/>
      <circle cx="560" cy="46" r="4"/>
    </g>
    <g transform="translate(340 46)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="40 46;560 46" dur="16s" repeatCount="indefinite"/>
      <rect x="-12" y="-7" width="24" height="14" rx="7" fill="#FFFFFF"/>
      <rect x="-6" y="-2" width="12" height="4" rx="2" fill="#1F55F0"/>
    </g>

    <!-- Validator device -->
    <g filter="url(#shadow)">
      <rect x="140" y="72" width="130" height="240" rx="24" fill="url(#device)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    </g>
    <rect x="154" y="86" width="102" height="96" rx="14" fill="#081343" stroke="#FFFFFF" stroke-opacity="0.12"/>

    <!-- Screen: idle -->
    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.29;0.3;0.97;1" dur="8s" repeatCount="indefinite"/>
      <use xlink:href="#nfc" x="203" y="124" opacity="0.8" stroke="#FFFFFF"/>
      <text x="205" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.8">Tap card</text>
    </g>
    <!-- Screen: processing -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.31;0.45;0.46;1" dur="8s" repeatCount="indefinite"/>
      <g fill="#FFFFFF">
        <circle cx="191" cy="126" r="4"><animate attributeName="fill-opacity" values="1;0.25;0.25;1" dur="0.9s" repeatCount="indefinite"/></circle>
        <circle cx="205" cy="126" r="4"><animate attributeName="fill-opacity" values="0.25;1;0.25;0.25" dur="0.9s" repeatCount="indefinite"/></circle>
        <circle cx="219" cy="126" r="4"><animate attributeName="fill-opacity" values="0.25;0.25;1;0.25" dur="0.9s" repeatCount="indefinite"/></circle>
      </g>
      <text x="205" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.8">Processing</text>
    </g>
    <!-- Screen: paid -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.47;0.95;0.97;1" dur="8s" repeatCount="indefinite"/>
      <g transform="translate(205 116)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="0;0;1.2;1;1" keyTimes="0;0.45;0.49;0.52;1" dur="8s" repeatCount="indefinite"/>
          <circle r="13" fill="#6EE7B7"/>
          <path d="M-5.5,0.5 L-1.5,4.5 L6,-4" fill="none" stroke="#06352A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <text x="205" y="152" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">$2.75</text>
      <text x="205" y="169" text-anchor="middle" font-size="10" font-weight="600" fill="#6EE7B7">Fare paid</text>
    </g>

    <!-- Tap zone -->
    <circle cx="205" cy="248" r="32" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.4" stroke-dasharray="3 5"/>
    <use xlink:href="#nfc" x="203" y="248" opacity="0.7" stroke="#FFFFFF"/>
    <!-- Status LED -->
    <rect x="180" y="294" width="50" height="4" rx="2" fill="#6EE7B7">
      <animate attributeName="fill" values="#7FA6FF;#7FA6FF;#6EE7B7;#6EE7B7;#7FA6FF" keyTimes="0;0.45;0.47;0.95;1" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- NFC waves -->
    <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
      <circle cx="205" cy="248" r="40" stroke-opacity="0">
        <animate attributeName="r" values="40;40;100;100" keyTimes="0;0.28;0.4;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0;0.7;0;0" keyTimes="0;0.28;0.29;0.4;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="205" cy="248" r="40" stroke-opacity="0">
        <animate attributeName="r" values="40;40;100;100" keyTimes="0;0.32;0.44;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0;0.6;0;0" keyTimes="0;0.32;0.33;0.44;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="205" cy="248" r="40" stroke-opacity="0">
        <animate attributeName="r" values="40;40;100;100" keyTimes="0;0.36;0.48;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0;0.5;0;0" keyTimes="0;0.36;0.37;0.48;1" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Transit card -->
    <g transform="translate(222 236)">
      <animateTransform attributeName="transform" type="translate" values="-110 250;-110 250;222 236;222 236;-110 250;-110 250" keyTimes="0;0.08;0.28;0.55;0.75;1" keySplines="0 0 1 1;.3 0 .1 1;0 0 1 1;.6 0 .8 .4;0 0 1 1" calcMode="spline" dur="8s" repeatCount="indefinite"/>
      <g transform="rotate(-10)" filter="url(#shadow)">
        <rect x="-62" y="-39" width="124" height="78" rx="11" fill="url(#cardFill)"/>
        <rect x="-62" y="-39" width="124" height="78" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.8"/>
        <rect x="-48" y="-22" width="20" height="15" rx="3" fill="#9DB9F5"/>
        <path d="M-48,-14.5 h20 M-38,-22 v15" stroke="#C9DCFF" stroke-width="1"/>
        <g transform="translate(40 -15) scale(0.6)"><use xlink:href="#nfc" stroke="#1F55F0"/></g>
        <text x="-48" y="18" font-size="8" font-weight="600" fill="#1F55F0" fill-opacity="0.6" letter-spacing="1.5">•••• 4021</text>
        <text x="-48" y="30" font-size="9" font-weight="800" fill="#0A1C66" letter-spacing="1.2">TRANSIT</text>
      </g>
    </g>

    <!-- Account panel -->
    <rect x="320" y="72" width="240" height="240" rx="20" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="340" y="100" font-size="11" fill="#FFFFFF" fill-opacity="0.7">Card balance</text>
    <text x="340" y="128" font-size="24" font-weight="800" fill="#FFFFFF" opacity="0">$21.00
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.47;0.48;0.97;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="340" y="128" font-size="24" font-weight="800" fill="#FFFFFF">$18.25
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.47;0.48;0.97;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <rect x="474" y="110" width="70" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="509" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Top up</text>
    <line x1="340" y1="146" x2="544" y2="146" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="340" y="168" font-size="11" fill="#FFFFFF" fill-opacity="0.7">Recent trips</text>

    <!-- Older rows (shift down when the new trip lands) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -44;0 -44;0 0;0 0;0 -44" keyTimes="0;0.47;0.53;0.95;1" keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1;0 0 1 1" calcMode="spline" dur="8s" repeatCount="indefinite"/>
      <g>
        <circle cx="354" cy="244" r="13" fill="#FFFFFF" fill-opacity="0.12"/>
        <rect x="348" y="239" width="12" height="9" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
        <text x="376" y="241" font-size="12" font-weight="700" fill="#FFFFFF">Route 7</text>
        <text x="376" y="255" font-size="10" fill="#FFFFFF" fill-opacity="0.6">Today · 08:14</text>
        <text x="544" y="248" text-anchor="end" font-size="12" font-weight="700" fill="#FFFFFF">−$2.75</text>
      </g>
      <g>
        <circle cx="354" cy="288" r="13" fill="#FFFFFF" fill-opacity="0.12"/>
        <path d="M354,282 v12 M348,288 h12" stroke="#6EE7B7" stroke-width="1.8" stroke-linecap="round"/>
        <text x="376" y="285" font-size="12" font-weight="700" fill="#FFFFFF">Top-up</text>
        <text x="376" y="299" font-size="10" fill="#FFFFFF" fill-opacity="0.6">Yesterday</text>
        <text x="544" y="292" text-anchor="end" font-size="12" font-weight="700" fill="#6EE7B7">+$20.00</text>
      </g>
    </g>

    <!-- New trip row -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.53;0.95;0.97;1" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="10 0;10 0;0 0;0 0" keyTimes="0;0.48;0.53;1" keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1" calcMode="spline" dur="8s" repeatCount="indefinite"/>
      <rect x="332" y="178" width="224" height="44" rx="12" fill="#FFFFFF" fill-opacity="0.1"/>
      <circle cx="354" cy="200" r="13" fill="#FFFFFF"/>
      <rect x="348" y="195" width="12" height="9" rx="2.5" fill="none" stroke="#1F55F0" stroke-width="1.5"/>
      <text x="376" y="197" font-size="12" font-weight="700" fill="#FFFFFF">Route 12</text>
      <text x="376" y="211" font-size="10" fill="#FFFFFF" fill-opacity="0.6">Central → Harbor · now</text>
      <text x="544" y="204" text-anchor="end" font-size="12" font-weight="700" fill="#FFFFFF">−$2.75</text>
    </g>
  </g>
</svg>